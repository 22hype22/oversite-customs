# Lives in 22hype22/oversite-roleplay as .github/workflows/sync.yml
# Mirrors the `roleplay` branch of the public oversite-customs repo (the
# Oversite Roleplay codebase) into this repo. Everything except .git and this
# workflow is replaced by the branch's tree. Runs when this file lands, every
# ten minutes, and on the Actions tab's "Run workflow" button.
name: Mirror the roleplay branch

on:
  push:
    paths: [".github/workflows/sync.yml"]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace the tree with the roleplay branch
        run: |
          set -e
          git clone --depth 1 --branch roleplay https://github.com/22hype22/oversite-customs /tmp/src
          rm -rf /tmp/src/.git
          # Wipe everything except .git and this workflow, then copy the branch in.
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/src/. .
          rm -rf .github/workflows/*.yml.tmp
          python3 -m py_compile main.py
      - name: Commit and push
        run: |
          git config user.name "oversite-sync"
          git config user.email "sync@oversite.shop"
          git add -A
          if git diff --cached --quiet; then echo "Already up to date."; exit 0; fi
          git commit -m "Mirror oversite-customs roleplay branch"
          git push
